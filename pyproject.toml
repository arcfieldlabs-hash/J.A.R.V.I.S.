[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arcfield-jarvis"
version = "0.2.0"
description = "A modular local JARVIS assistant for macOS and Ollama"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
voice = ["SpeechRecognition[audio,whisper-local]>=3.10"]
browser = ["playwright>=1.48"]
monitor = ["psutil>=5.9"]
google = ["google-api-python-client>=2.100", "google-auth-httplib2>=0.2", "google-auth-oauthlib>=1.1"]
menubar = ["rumps>=0.4"]

[project.scripts]
jarvis = "jarvis.cli:main"

[tool.setuptools]
packages = ["jarvis"]
package-dir = {jarvis = "."}

[tool.setuptools.package-data]
jarvis = ["web/index.html"]
